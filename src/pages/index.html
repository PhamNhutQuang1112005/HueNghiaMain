<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Nhà xe Huệ Nghĩa Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login/login.css">
</head>
<body>

<div class="auth-wrap">

  <!-- ============ NỬA TRÁI: ẢNH XE ============ -->
  <div class="auth-right">
    <img
      class="auth-hero-img"
      src="../assets/img/login-hero.png"
      alt="Đội xe Huệ Nghĩa Express"
    >
  </div>

  <!-- ============ NỬA PHẢI: FORM ĐĂNG NHẬP ============ -->
  <div class="auth-left">
    <div class="auth-left-glow" aria-hidden="true"></div>

    <div class="auth-form-box">

      <div class="auth-brand">
        <div class="auth-brand-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9"/><path d="M4 16h16"/><path d="M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M18 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>
        </div>
        <div class="auth-brand-text">
          <b>HUỆ NGHĨA EXPRESS</b>
          <span>Hệ thống quản lý nhà xe</span>
        </div>
      </div>

      <header class="auth-heading">
        <h1 class="auth-title">Welcome back!</h1>
      </header>

      <div class="auth-error" id="authError">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span id="authErrorText">Sai tài khoản hoặc mật khẩu.</span>
      </div>

      <form id="loginForm" autocomplete="off">

        <div class="field-group">
          <label for="username">Tài khoản</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" name="username" placeholder="vd: tongdai01" required>
          </div>
        </div>

        <div class="field-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Hiện/ẩn mật khẩu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="field-row">
          <label class="remember-check">
            <input type="checkbox" id="rememberMe">
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">Đăng nhập</button>

      </form>

    </div>

    <div class="auth-footer">© 2026 Huệ Nghĩa Express — Hệ thống quản lý nhà xe nội bộ</div>

  </div>

</div>

<script src="../shared/js/storage-keys.js?v=8"></script>
<script src="../auth/session.js?v=1"></script>
<script src="../auth/accounts.js?v=1"></script>
<script src="login/login.js?v=5"></script>
</body>
</html>
